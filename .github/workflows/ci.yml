name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  test:
    name: Unit + integration (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers uses the runner's Docker daemon for Postgres 16.
      - run: pnpm test

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Scanner images pinned by digest: semgrep 1.176.1, trivy 0.74.0, gitleaks 8.30.1.
      - name: Semgrep (SAST)
        run: >
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
          semgrep scan --config p/owasp-top-ten --config p/typescript --error
          --exclude skills --exclude drizzle --metrics off
      - name: Trivy (SCA)
        run: >
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --skip-dirs /src/skills /src
      - name: Gitleaks (secrets)
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --exit-code 1

  e2e:
    name: Build + E2E
    runs-on: ubuntu-latest
    # The wizard writes a profile and a report, so the suite needs a real database and a
    # published catalogue. It runs against synthetic fixtures, never data/programs, whose
    # programmes stay drafts until a human verifies them (ADR-8).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: da3m
          POSTGRES_PASSWORD: da3m
          POSTGRES_DB: da3m
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U da3m -d da3m"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://da3m:da3m@localhost:5432/da3m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm e2e:seed
      - run: pnpm build
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
